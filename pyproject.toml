[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenspace"
version = "1.0.0"
description = "Single-GPU Spatial Prefill-Decode Disaggregation Engine via CUDA Green Contexts"
authors = [{ name = "Project GreenSpace Core Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "rich>=13.0.0",
]

