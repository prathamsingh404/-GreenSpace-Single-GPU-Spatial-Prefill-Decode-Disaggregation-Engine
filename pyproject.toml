[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenspace"
version = "1.0.0"
description = "Single-GPU Spatial Prefill-Decode Disaggregation Engine via CUDA Green Contexts"
authors = [{ name = "Project GreenSpace Core Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "cuda-bindings>=13.5,<14",
    "nvidia-cuda-nvrtc>=13,<14",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.23"]
audit = ["pytest>=8"]

[tool.setuptools.package-data]
"greenspace.hardware" = ["*.cuh"]
"greenspace.web" = ["static/*.html"]
